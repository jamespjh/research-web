---
- name: Git clone the web content to the server
  # https://docs.ansible.com/ansible/latest/collections/ansible/builtin/git_module.html
  ansible.builtin.git:
    repo: https://github.com/jamespjh/research-web.git
    dest: builds/clone
  register: clone

- name: Copy from the clone to a folder named for the sha
  # We are building up every deployment as separate folders, so we don't overwrite them
  ansible.builtin.copy:
    remote_src: true
    src: builds/clone/
    dest: builds/{{ clone.after }}

- name: Build the site
  # Not idempotent: rebuilds every run, even if this sha was already built
  ansible.builtin.shell:
    chdir: builds/{{ clone.after }}
    cmd: |
      eval "$(rbenv init - bash)"
      rbenv install -s `cat .ruby-version`
      gem install bundler
      bundle install
      bundle exec jekyll build

- name: Copy the built site to a folder named for the sha under /var/www
  # Under /var/www the files get SELinux's httpd_sys_content_t label by default, so no chcon is needed
  ansible.builtin.copy:
    remote_src: true
    src: /home/almalinux/builds/{{ clone.after }}/_site/
    dest: /var/www/builds/research/{{ clone.after }}/
  become: true

- name: Repoint the symlink to the latest build
  ansible.builtin.file:
    src: /var/www/builds/research/{{ clone.after }}
    dest: /var/www/html/research
    state: link
  become: true

- name: Set up the apache config
  become: true
  ansible.builtin.copy:
    src: web.conf
    dest: /etc/httpd/conf.d/web.conf
  notify: Restart httpd
